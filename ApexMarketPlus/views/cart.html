<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ApexMarket+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: flex; flex-direction: column; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .container { max-width: 900px; margin: 0 auto; width: 100%; padding: 0 1.5rem; }
        header { background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #1e293b; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
        .cart-item { display: flex; align-items: center; justify-content: space-between; background: #1e293b; border: 1px solid #334155; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }
        .checkout-box { background: #1e293b; border: 1px solid #334155; padding: 1.5rem; border-radius: 8px; margin-top: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .btn { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: #94a3b8; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.7rem; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; outline: none; }
        footer { background: #020617; border-top: 1px solid #1e293b; color: #94a3b8; padding: 2rem; margin-top: auto; text-align: center; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">Apex<span style="color: #818cf8;">Market</span><span style="color: #a855f7;">+</span></a>
        <a href="/" style="color: #94a3b8; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Continue Shopping</a>
    </header>

    <main class="container" style="margin: 3rem auto;">
        <h2 style="margin-bottom: 1.5rem; font-size: 1.8rem;">Your Shopping Cart</h2>
        <div id="cartContent">
            <div id="cartItemsList"></div>
            <div id="cartSummary"></div>
        </div>
        <div id="checkoutFormSection" style="display: none; background: #1e293b; border: 1px solid #334155; padding: 2rem; border-radius: 12px; margin-top: 2rem;">
            <h3 style="margin-bottom: 1.5rem; color: #fff;">Shipping & Checkout Details</h3>
            <form onsubmit="handleCheckout(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" required placeholder="Ali Khan">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" required placeholder="03001234567">
                </div>
                <div class="form-group">
                    <label>Delivery Address (Sialkot / Pakistan)</label>
                    <input type="text" required placeholder="Street #, Area, City">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Place Order</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Sialkot, Pakistan | Contact: 03056225317</p>
        <p style="margin-top: 0.5rem;">&copy; 2026 ApexMarket Inc. All rights reserved.</p>
    </footer>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('apex_cart')) || [];
            const listEl = document.getElementById('cartItemsList');
            const summaryEl = document.getElementById('cartSummary');

            if (cart.length === 0) {
                listEl.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 3rem 0;">Your cart is empty.</p>';
                summaryEl.innerHTML = '';
                return;
            }

            let total = 0;
            listEl.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="cart-item">
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <img src="${item.image}" alt="${item.title}">
                            <div>
                                <h4 style="font-size: 1rem; color: #fff;">${item.title}</h4>
                                <span style="color: #94a3b8; font-size: 0.85rem;">${item.category}</span>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 1.5rem;">
                            <span style="font-weight: bold; font-size: 1.1rem; color: #fff;">$${item.price}</span>
                            <button onclick="removeItem(${index})" style="background: #ef4444; border: none; color: white; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            summaryEl.innerHTML = `
                <div class="checkout-box">
                    <div>
                        <h3 style="color: #fff; margin-bottom: 0.2rem;">Total Amount:</h3>
                        <span style="font-size: 1.75rem; font-weight: 800; color: #818cf8;">$${total}</span>
                    </div>
                    <button onclick="showCheckoutForm()" class="btn">Proceed to Checkout</button>
                </div>
            `;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('apex_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('apex_cart', JSON.stringify(cart));
            loadCart();
        }

        function showCheckoutForm() {
            let cart = JSON.parse(localStorage.getItem('apex_cart')) || [];
            if (cart.length === 0) return alert('Your cart is empty!');
            document.getElementById('cartContent').style.display = 'none';
            document.getElementById('checkoutFormSection').style.display = 'block';
        }

        function handleCheckout(e) {
            e.preventDefault();
            alert('Order placed successfully! Thank you for shopping with ApexMarket+.');
            localStorage.removeItem('apex_cart');
            window.location.href = '/';
        }

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
    <script>
    // Check if user is logged in
    const currentUser = localStorage.getItem('currentUser');
    if (!currentUser) {
        window.location.href = '/login';
    }
</script>
</body>
</html>
